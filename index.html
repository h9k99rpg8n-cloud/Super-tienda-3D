<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Súper Tienda 3D — prototipo web móvil con movimiento y joystick táctil." />
  <title>Súper Tienda 3D</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game" aria-label="Súper Tienda 3D"></div>

  <div id="hud">
    <div class="brand">
      <strong>SÚPER TIENDA 3D</strong>
      <span>Alpha 0.0.1</span>
    </div>
    <div id="fps" aria-live="polite">-- FPS</div>
  </div>

  <div id="crosshair" aria-hidden="true"></div>

  <div id="joystick" class="touch-control" aria-label="Joystick de movimiento">
    <div class="joystick-ring"></div>
    <div id="joystick-knob"></div>
  </div>

  <button id="interact" class="touch-control" type="button" aria-label="Interactuar">USAR</button>

  <div id="hint">
    <span class="desktop-hint">WASD para caminar · clic y mueve el ratón para mirar</span>
    <span class="mobile-hint">🕹️ Mueve el joystick · arrastra la pantalla para mirar</span>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
